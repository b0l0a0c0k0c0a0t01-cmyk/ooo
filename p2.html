<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انتي الهدية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            /* Romantic dark crimson & rose radial background */
            background: radial-gradient(circle at top, #4a0e24 0%, #240712 55%, #0f0308 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            overflow: hidden;
        }

        /* Floating Hearts Background Container */
        .hearts-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .heart-particle {
            position: absolute;
            bottom: -50px;
            color: rgba(255, 77, 121, 0.25);
            user-select: none;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.6;
            }
            80% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-110vh) scale(1.2) rotate(25deg);
                opacity: 0;
            }
        }

        /* Centered Message Container */
        .center-message {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px 30px;
            background: rgba(35, 10, 20, 0.55);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 77, 121, 0.35);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            animation: popIn 0.9s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .center-message h1 {
            font-size: clamp(2.4rem, 7vw, 4.2rem);
            color: #ffd6e0;
            text-shadow: 0 0 25px rgba(255, 77, 121, 0.75);
            line-height: 1.3;
        }

        .center-message .heart-accent {
            display: block;
            margin-top: 14px;
            font-size: 2.2rem;
            color: #ff4d79;
            animation: pulse 1.8s ease-in-out infinite;
        }

        /* Back Button */
        .back-btn {
            position: relative;
            z-index: 1;
            margin-top: 36px;
            padding: 12px 28px;
            background: rgba(255, 77, 121, 0.12);
            color: #ff4d79;
            border: 2px solid #ff4d79;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #ff4d79;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 77, 121, 0.5);
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.88) translateY(15px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.18); }
        }
    </style>
</head>
<body>

    <!-- Animated Floating Hearts Background -->
    <div class="hearts-bg" id="heartsBg"></div>

    <main class="center-message">
        <h1>انتي الهدية</h1>
        <span class="heart-accent">♥</span>
    </main>

    <a href="index.html" class="back-btn">العودة للهدية</a>

    <script>
        // Generate continuous floating hearts in the background
        const heartsBg = document.getElementById('heartsBg');
        const heartSymbols = ['❤', '♥', '💕'];

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];

            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 14) + 'px';
            const duration = Math.random() * 6 + 6;
            heart.style.animationDuration = duration + 's';

            heartsBg.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        setInterval(createHeart, 450);
    </script>

</body>
</html>
