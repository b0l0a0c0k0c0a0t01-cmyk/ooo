<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض الذكريات والحب</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            /* Romantic dark crimson & rose radial background */
            background: radial-gradient(circle at top, #4a0e24 0%, #240712 55%, #0f0308 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Floating Hearts Background Container */
        .hearts-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .heart-particle {
            position: absolute;
            bottom: -50px;
            color: rgba(255, 77, 121, 0.25);
            user-select: none;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.6;
            }
            80% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-110vh) scale(1.2) rotate(25deg);
                opacity: 0;
            }
        }

        /* Ensure main content stays above floating hearts */
        header, .gallery, .back-btn {
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            color: #ff4d79;
            font-size: 2.2rem;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(255, 77, 121, 0.5);
        }

        header p {
            color: #f3c6d3;
            font-size: 1rem;
        }

        /* Gallery Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1000px;
        }

        .card {
            background: rgba(35, 10, 20, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 77, 121, 0.3);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: #ff4d79;
            box-shadow: 0 15px 35px rgba(255, 77, 121, 0.25);
        }

        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .card:hover img {
            transform: scale(1.05);
        }

        .card-caption {
            padding: 15px;
            text-align: center;
            font-weight: 600;
            color: #ffd6e0;
        }

        /* Back Button */
        .back-btn {
            margin-top: 40px;
            padding: 12px 28px;
            background: rgba(255, 77, 121, 0.1);
            color: #ff4d79;
            border: 2px solid #ff4d79;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #ff4d79;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 77, 121, 0.5);
        }

        /* Lightbox Modal for Full View */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 3, 8, 0.92);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 12px;
            border: 2px solid #ff4d79;
            box-shadow: 0 0 30px rgba(255, 77, 121, 0.4);
        }
    </style>
</head>
<body>

    <!-- Animated Floating Hearts Background -->
    <div class="hearts-bg" id="heartsBg"></div>

    <header>
        <h1>كل الحب لك ❤️</h1>
        <p>اضغط على أي صورة لتكبيرها</p>
    </header>

    <div class="gallery">
        <!-- Image 1 -->
        <div class="card" onclick="openModal('img1.jpg')">
            <img src="IMG-20261120-WA0005.jpg" alt="الصورة الأولى">
            <div class="card-caption">الذكرى الأولى ♥</div>
        </div>

        <!-- Image 2 -->
        <div class="card" onclick="openModal('img2.jpg')">
            <img src="IMG-20261120-WA0007.jpg" alt="الصورة الثانية">
            <div class="card-caption">الذكرى الثانية ♥</div>
        </div>

        <!-- Image 3 -->
        <div class="card" onclick="openModal('img3.jpg')">
            <img src="IMG-20261120-WA0009.jpg" alt="الصورة الثالثة">
            <div class="card-caption">الذكرى الثالثة ♥</div>
        </div>
    </div>

    <a href="index.html" class="back-btn">العودة للهدية</a>

    <!-- Fullscreen Image Preview -->
    <div class="modal" id="imageModal" onclick="closeModal()">
        <img id="modalImg" src="" alt="معاينة الصورة">
    </div>

    <script>
        // Generate continuous floating hearts in the background
        const heartsBg = document.getElementById('heartsBg');
        const heartSymbols = ['❤', '♥', '💕'];

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            
            // Randomize horizontal position, size, and animation speed
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 14) + 'px';
            const duration = Math.random() * 6 + 6; // 6s to 12s
            heart.style.animationDuration = duration + 's';
            
            heartsBg.appendChild(heart);

            // Clean up DOM element after animation ends
            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        // Spawn a new heart every 450ms
        setInterval(createHeart, 450);

        // Lightbox Modal Functions
        function openModal(src) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            modalImg.src = src;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }
    </script>

</body>
</html>
