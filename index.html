<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هدية خاصة لـ يُسرية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Matching romantic crimson & rose background */
            background: radial-gradient(circle at top, #4a0e24 0%, #240712 55%, #0f0308 100%);
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* Floating Hearts Background Container */
        .hearts-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .heart-particle {
            position: absolute;
            bottom: -50px;
            color: rgba(255, 77, 121, 0.25);
            user-select: none;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.6;
            }
            80% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-110vh) scale(1.2) rotate(25deg);
                opacity: 0;
            }
        }

        /* Keep interactive elements above floating hearts */
        .title, .gift-container, .hint {
            position: relative;
            z-index: 1;
        }

        .title {
            margin-bottom: 50px;
            font-size: 2rem;
            color: #ff4d79;
            text-align: center;
            padding: 0 15px;
            text-shadow: 0 0 20px rgba(255, 77, 121, 0.5);
            animation: fadeIn 1.5s ease-in-out;
        }

        .title span {
            color: #ffd6e0;
        }

        /* Gift Container */
        .gift-container {
            position: relative;
            width: 160px;
            height: 160px;
            cursor: pointer;
            animation: float 2.5s ease-in-out infinite;
            transition: transform 0.3s ease;
        }

        .gift-container:hover {
            transform: scale(1.08);
        }

        /* Gift Box Lid */
        .gift-lid {
            position: absolute;
            top: 0;
            left: -10px;
            width: 180px;
            height: 40px;
            background: linear-gradient(135deg, #ff4d79, #b81d46);
            border-radius: 6px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
            z-index: 2;
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.6s ease;
        }

        /* Ribbon on Lid */
        .gift-lid::before {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 100%;
            background: #ffd6e0;
        }

        /* Gift Bow */
        .bow-left, .bow-right {
            position: absolute;
            top: -25px;
            width: 35px;
            height: 25px;
            border: 6px solid #ffd6e0;
            border-radius: 50% 50% 0 50%;
        }

        .bow-left {
            left: 52px;
            transform: rotate(-15deg);
        }

        .bow-right {
            right: 52px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(15deg);
        }

        /* Gift Box Body */
        .gift-box {
            position: absolute;
            bottom: 0;
            width: 160px;
            height: 120px;
            background: linear-gradient(135deg, #e02454, #7a0c28);
            border-radius: 0 0 10px 10px;
            box-shadow: 0 15px 35px rgba(255, 77, 121, 0.3);
        }

        /* Ribbon on Body */
        .gift-box::before {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 100%;
            background: #ffd6e0;
        }

        .hint {
            margin-top: 35px;
            font-size: 1rem;
            color: #f3c6d3;
            letter-spacing: 0.5px;
        }

        /* Opening Animation Class */
        .gift-container.open .gift-lid {
            transform: translateY(-70px) rotate(-15deg);
            opacity: 0;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Animated Floating Hearts Background -->
    <div class="hearts-bg" id="heartsBg"></div>

    <h1 class="title">هدية خاصة لـ <span>يُسرية</span> ❤️</h1>

    <div class="gift-container" id="giftBox" onclick="openGift()">
        <div class="gift-lid">
            <div class="bow-left"></div>
            <div class="bow-right"></div>
        </div>
        <div class="gift-box"></div>
    </div>

    <p class="hint">اضغطي على الهدية لفتحها يا يُسرية</p>

    <script>
        // Generate continuous floating hearts in the background
        const heartsBg = document.getElementById('heartsBg');
        const heartSymbols = ['❤', '♥', '💕'];

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];

            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 14) + 'px';
            const duration = Math.random() * 6 + 6;
            heart.style.animationDuration = duration + 's';

            heartsBg.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        setInterval(createHeart, 450);

        // Gift Opening & Redirect to p2.html
        function openGift() {
            const gift = document.getElementById('giftBox');
            gift.classList.add('open');

            setTimeout(() => {
                window.location.href = 'p2.html';
            }, 650);
        }
    </script>

</body>
</html>
